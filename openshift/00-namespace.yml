---
apiVersion: v1
kind: Namespace
metadata:
  name: aap
  labels:
    app.kubernetes.io/part-of: selfheal-demo
---
# Namespace-scoped install: the operator only manages the `aap` namespace.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: aap-operator-group
  namespace: aap
spec:
  targetNamespaces:
    - aap
