---
# Builds the workload you are going to break on stage:
#   nginx (:80)  ->  demo-api (127.0.0.1:8080, systemd)
#
# Run as the AAP job template "Demo :: Prepare app", or from your laptop:
#   ansible-playbook playbooks/prepare_demo_app.yml
- name: Build the demo workload
  hosts: demo_app
  become: true

  vars:
    demo_api_port: 8080

  tasks:
    - name: Install packages
      ansible.builtin.dnf:
        name:
          - nginx
          - python3
        state: present

    - name: Create the demo-api service account
      ansible.builtin.user:
        name: demoapi
        system: true
        shell: /sbin/nologin
        home: /opt/demo-api
        create_home: true

    - name: Deploy the demo-api application
      ansible.builtin.copy:
        dest: /opt/demo-api/app.py
        owner: demoapi
        group: demoapi
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          """Deliberately tiny HTTP service. The star of the demo."""
          import json, socket, time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          STARTED = time.time()
          VERSION = "1.0.0"

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _send(self, code, body, ctype="application/json"):
                  payload = body.encode()
                  self.send_response(code)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def do_GET(self):
                  if self.path.startswith("/health"):
                      self._send(200, json.dumps({
                          "status": "ok",
                          "service": "demo-api",
                          "version": VERSION,
                          "host": socket.gethostname(),
                          "uptime_seconds": round(time.time() - STARTED, 1),
                      }))
                  elif self.path == "/":
                      self._send(200, (
                          "<html><head><title>Payments API</title>"
                          "<meta http-equiv='refresh' content='2'>"
                          "<style>body{font-family:system-ui;background:#0b1021;color:#e6edf3;"
                          "display:flex;align-items:center;justify-content:center;height:100vh;"
                          "margin:0;flex-direction:column}h1{font-size:3rem;margin:0}"
                          ".ok{color:#3fb950}</style></head><body>"
                          "<h1 class='ok'>&#10003; Payments API</h1>"
                          f"<p>demo-api {VERSION} on {socket.gethostname()} &mdash; "
                          f"up {round(time.time() - STARTED)}s</p>"
                          "</body></html>"), "text/html")
                  else:
                      self._send(404, json.dumps({"error": "not found"}))

              def log_message(self, *args):
                  pass

          if __name__ == "__main__":
              ThreadingHTTPServer(("127.0.0.1", {{ demo_api_port }}), Handler).serve_forever()
      notify: Restart demo-api

    - name: Install the demo-api unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/demo-api.service
        mode: "0644"
        content: |
          [Unit]
          Description=Demo Payments API
          After=network-online.target

          [Service]
          Type=simple
          User=demoapi
          ExecStart=/usr/bin/python3 /opt/demo-api/app.py
          # Deliberately NOT Restart=always — systemd auto-restart would heal the
          # outage before Dynatrace sees it and there would be no demo.
          Restart=no

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart demo-api

    - name: Point nginx at demo-api
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/demo-api.conf
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              server_name _;
              location / {
                  proxy_pass http://127.0.0.1:{{ demo_api_port }};
                  proxy_set_header Host $host;
                  proxy_connect_timeout 2s;
                  proxy_read_timeout 5s;
              }
          }
      # `default_server` wins over the stock server block in nginx.conf for any
      # request addressed by IP, so the stock config can stay untouched.
      notify: Restart nginx

    - name: Enable SELinux network connections for nginx
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true

    - name: Start and enable services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - demo-api
        - nginx

    - name: Wait for the app to answer
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

    - name: Show the result
      ansible.builtin.debug:
        msg: "demo-api healthy on {{ inventory_hostname }} — {{ health.json }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart demo-api
      ansible.builtin.systemd:
        name: demo-api
        state: restarted

    - name: Restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
